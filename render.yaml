services:
  - type: web
    name: kashmir-openweather
    runtime: python
    repo: https://github.com/Cypher-Emm/openweather
    branch: main
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn weather.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
